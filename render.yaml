services:
  - type: web
    name: spire-of-the-archon
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node server/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard (sync: false keeps credentials out of git).
      - key: CLIENT_ORIGIN
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_CONNECT_STRING
        sync: false
      - key: SESSION_SECRET
        sync: false
